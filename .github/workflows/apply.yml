---
name: Apply

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Terraform workspace to apply against.
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      limit:
        description: "ansible --limit pattern (default: all connectors)."
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  group: apply-${{ inputs.workspace }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, "${{ inputs.workspace }}-runner"]
    environment: ${{ inputs.workspace }}
    env:
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
        
    steps:
      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Setup Keys
        uses: ./.github/actions/configure-keys

      - uses: actions/checkout@v6

      - name: Apply Ansible config
        run: |
          ansible-playbook deploy.yml -vvv -i 'inventories/${{ inputs.workspace }}/terraform_state.yml' -l "${{ inputs.limit }}" 
