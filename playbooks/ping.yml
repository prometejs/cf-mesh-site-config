---
- name: Pre-flight — fail loudly on empty inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert at least one connector resolved from state
      ansible.builtin.assert:
        that: groups['connectors'] | default([]) | length > 0
        fail_msg: >-
          No hosts in group 'connectors'. Either the Terraform state has no
          connector sites yet, or TF_WORKSPACE / -l limit excluded them all.

- name: Sanity check — verify inventory contract and reachability
  hosts: connectors
  gather_facts: false

  tasks:
    - name: Ping each connector
      ansible.builtin.ping:

    - name: Show inventory contract fields for this host
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          ansible_host: "{{ ansible_host }}"
          site_cidr: "{{ site_cidr }}"
          remote_cidrs: "{{ remote_cidrs | from_json }}"
          location: "{{ location }}"
