# workspace ref:`env:/prod/` baked into key path
---
plugin: cloud.terraform.terraform_state
backend_type: s3
backend_config:
  bucket: tf-prometejs-state-bucket
  key: env:/prod/cloudflare-infra/prod/terraform.tfstate
  region: eu-west-2
search_child_modules: true
provider_mapping:
  - provider_name: registry.terraform.io/ansible/ansible
    types:
      - ansible_host
compose:
  ansible_host: variables.value.ansible_host
  remote_cidrs: variables.value.remote_cidrs | from_json
  location: variables.value.tags.location
  site_cidr: variables.value.site_cidr
  mac: variables.value.tags.mac
  variables: {} # override default dict
keyed_groups:
  - key: groups
  - key: variables.value.environment
hostnames:
  - name